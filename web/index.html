<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Coursework AI</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand"><div class="brand-mark">C</div><div><strong>Coursework</strong><span>AI workspace</span></div></div>
        <button class="new-course" id="new-course" type="button"><span>＋</span> 新建课程</button>
        <div class="sidebar-label">课程空间</div>
        <nav class="course-list" id="course-list"></nav>
        <div class="sidebar-footer"><span class="status-dot"></span><div><strong>本地运行</strong><span>资料保存在这台电脑</span></div></div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button class="icon-button mobile-only" id="menu-button" type="button" aria-label="打开课程栏">☰</button>
          <div class="course-heading"><strong id="active-course-name">选择一门课程</strong><span id="active-course-detail">创建课程后开始写作业</span></div>
          <div class="top-actions">
            <button class="ghost-button" id="review-open" type="button" disabled>复习计划</button>
            <button class="ghost-button" id="materials-open" type="button" disabled>资料库</button>
          </div>
        </header>

        <section class="conversation" id="conversation">
          <div class="welcome" id="welcome">
            <div class="welcome-mark">C</div>
            <h1>今天要完成什么作业？</h1>
            <p>选择课程，粘贴题目。我会先查找你的课程资料，再生成带依据的作业草稿。</p>
          </div>
          <div class="message-list" id="message-list"></div>
        </section>

        <section class="composer-wrap">
          <div class="mode-tabs" role="tablist" aria-label="工作模式">
            <button class="mode-tab active" data-mode="draft" type="button">写作业</button>
            <button class="mode-tab" data-mode="ask" type="button">随时问答</button>
            <button class="mode-tab" data-mode="review" type="button">检查答案</button>
          </div>
          <form class="composer" id="composer-form">
            <textarea id="composer-input" rows="1" placeholder="粘贴作业题目，按 Enter 发送…"></textarea>
            <textarea id="attempt-input" class="attempt-input hidden" rows="2" placeholder="粘贴你已经写好的答案…"></textarea>
            <div class="image-preview hidden" id="image-preview">
              <img id="image-preview-thumb" alt="待发送的作业题图片" />
              <div><strong id="image-preview-name"></strong><span>将和题目一起发送</span></div>
              <button id="image-remove" type="button" aria-label="移除图片">×</button>
            </div>
            <div class="composer-bottom">
              <div class="composer-tools">
                <label class="attach-button" id="attach-button" for="homework-image" title="上传题目照片" aria-label="上传题目照片">＋</label>
                <input id="homework-image" class="file-input" type="file" accept="image/jpeg,image/png,image/webp" />
                <span id="composer-hint">将根据当前课程资料生成作业草稿</span>
              </div>
              <button class="send-button" id="send-button" type="submit" aria-label="发送">↑</button>
            </div>
          </form>
          <p class="composer-status" id="composer-status" role="status"></p>
          <p class="disclaimer">生成内容可能有误，请核对课程要求、事实和引用。</p>
        </section>
      </main>
    </div>

    <dialog id="course-dialog">
      <form class="dialog-card" id="course-form">
        <div class="dialog-header"><div><span>NEW COURSE</span><h2>创建课程空间</h2></div><button class="close-button" type="button" data-close="course-dialog" aria-label="关闭">×</button></div>
        <label>课程名称<input id="course-name" maxlength="120" required placeholder="例如：管理学原理" /></label>
        <label>课程说明<textarea id="course-description" maxlength="1000" placeholder="例如：本学期专业必修课"></textarea></label>
        <p class="form-message" id="course-message"></p>
        <button class="primary-button" type="submit">创建并进入</button>
      </form>
    </dialog>

    <dialog id="materials-dialog">
      <div class="dialog-card wide-dialog">
        <div class="dialog-header"><div><span>KNOWLEDGE BASE</span><h2>课程资料库</h2></div><button class="close-button" type="button" data-close="materials-dialog" aria-label="关闭">×</button></div>
        <form id="document-form" class="upload-zone">
          <label>上传 Markdown 或 TXT<input id="document-file" type="file" accept=".md,.txt,text/plain,text/markdown" required /></label>
          <button class="primary-button" type="submit">上传资料</button>
        </form>
        <p class="form-message" id="document-message"></p>
        <div class="document-list" id="document-list"></div>
      </div>
    </dialog>

    <dialog id="review-dialog">
      <div class="dialog-card wide-dialog">
        <div class="dialog-header"><div><span>EXAM MODE</span><h2>紧急复习计划</h2></div><button class="close-button" type="button" data-close="review-dialog" aria-label="关闭">×</button></div>
        <form id="review-form" class="review-form">
          <label>考试范围<input id="review-scope" value="全部内容" required /></label>
          <label>可用时间（小时）<input id="review-hours" type="number" min="0.5" max="168" step="0.5" value="3" required /></label>
          <label>薄弱主题（可选）<input id="weak-topics" placeholder="例如：心理安全" /></label>
          <button class="primary-button" type="submit">生成计划</button>
        </form>
        <p class="form-message" id="review-message"></p>
        <article id="review-result"></article>
      </div>
    </dialog>

    <div class="sidebar-scrim" id="sidebar-scrim"></div>
    <script src="/static/app.js"></script>
  </body>
</html>

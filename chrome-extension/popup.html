<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Coursework AI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header><strong>Coursework AI</strong><span>Chrome Companion v0.4</span></header>
    <label>使用课程<select id="course"></select></label>
    <label class="knowledge-toggle">
      <input id="allow-general-knowledge" type="checkbox" checked />
      <span>资料不足时，允许 AI 使用通用知识</span>
    </label>
    <p class="notice">只有点击下方按钮后才读取当前标签页。优先使用你选中的文字，否则读取页面可见文字。启用 AI 后，这些题目文字会由本地作业机发送给已配置的模型。</p>
    <button id="analyze" class="primary">读取当前页面并生成草稿</button>
    <p id="status"></p>
    <article id="result" hidden></article>
    <form id="follow-up-form" hidden>
      <textarea id="follow-up" rows="2" placeholder="继续追问，例如：改短一点、用更简单的英语…"></textarea>
      <button id="follow-up-send" class="primary" type="submit">继续问</button>
    </form>
    <div class="actions" hidden id="actions">
      <button id="copy">复制草稿</button>
      <button id="open">打开作业机</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
